name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Verify the committed gradle-wrapper.jar matches a published Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner ships the Android SDK at $ANDROID_SDK_ROOT; ensure the exact
      # platform + build-tools (d8) the dex task needs are present.
      - name: Install Android SDK packages
        run: |
          sdk="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null 2>&1 || true
          "$sdk" "platforms;android-34" "build-tools;34.0.0"

      - name: Build, test, dex (agent) + assemble (a11y, fixture)
        run: ./gradlew :agent:test :agent:dex :a11y:testDebugUnitTest :a11y:assembleDebug :fixture-compose:assembleDebug
